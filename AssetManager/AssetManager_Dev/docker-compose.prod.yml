services:
  # Database: PostgreSQL (Production)
  postgres:
    image: postgres:15-alpine
    container_name: asset-manager-db-prod
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-asset_manager}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
    # No ports exposed to host for security; only accessible within the docker network
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data

  # Cache: Redis (Production)
  redis:
    image: redis:7-alpine
    container_name: asset-manager-cache-prod
    restart: always
    # No ports exposed to host for security

  # Backend Application (Production - Port 80)
  app-prod:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: asset-manager-prod
    depends_on:
      - postgres
      - redis
    restart: always
    ports:
      - "80:8080" # Maps standard web port 80 to internal 8080
    environment:
      - NODE_ENV=production
      - PORT=8080
      - DB_CLIENT=postgresql
      - DB_HOST=postgres
      - DB_NAME=${DB_NAME:-asset_manager}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-password}
      - DB_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379

volumes:
  postgres_prod_data:
