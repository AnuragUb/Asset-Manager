<!-- Raul Drunk Navigation Component -->
<style>
/* --- Raul Drunk Nav Integration --- */
:root {
    --nav-outer-bg: linear-gradient(180deg, #1f1f1f 0%, #111 100%);
    --nav-inner-bg: #0a0a0a;
    --text-color: #888;
    --text-hover: #ccc;
    --text-active: #fff;
    --active-bubble-bg: linear-gradient(180deg, #333 0%, #1f1f1f 100%);
    --hover-bubble-bg: linear-gradient(180deg, #222 0%, #000 100%);
    --ease-spring: linear(
        0, 0.006, 0.025 2.8%, 0.101 6.1%, 0.539 18.9%, 0.721 25.3%, 0.849 31.5%,
        0.937 38.1%, 0.968 41.8%, 0.991 45.7%, 1.006 50.1%, 1.015 55%, 1.017 63.9%,
        1.001 87.1%, 1
    );
}

.top-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto;
    height: auto;
    background: var(--nav-inner-bg);
    border-radius: 999px;
    padding: 4px;
    box-shadow: inset 0 2px 6px rgba(0,0,0,0.6);
    position: relative;
    anchor-name: --nav-container;
}

.top-nav ul {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    align-items: center;
    gap: 2px;
    position: relative;
    z-index: 10;
}

.top-nav li {
    display: block;
    position: relative;
}

.top-nav li:hover {
    anchor-name: --hover-target;
}

.top-nav .nav-link {
    display: block;
    text-decoration: none;
    color: var(--text-color);
    padding: 4px 8px;
    border-radius: 999px;
    font-weight: 600;
    font-size: 0.8rem;
    white-space: nowrap;
    position: relative;
    transition: color 0.3s;
    background: transparent;
}

.top-nav .nav-link:hover {
    color: var(--text-hover);
    background: transparent;
}

.top-nav .nav-link.active {
    color: var(--text-active);
    text-shadow: 0 1px 2px rgba(0,0,0,0.8);
    anchor-name: --active-target;
    background: transparent;
}

/* Remove any pseudo-elements that might interfere */
.top-nav .nav-link.active::after {
    display: none;
}

.bubble {
    position: absolute;
    border-radius: 999px;
    pointer-events: none;
    top: anchor(top);
    bottom: anchor(bottom);
    left: anchor(left);
    right: anchor(right);
    transition: 
        top 0.4s var(--ease-spring),
        bottom 0.4s var(--ease-spring),
        left 0.4s var(--ease-spring),
        right 0.4s var(--ease-spring),
        opacity 0.3s ease,
        background 0.3s ease;
}

.bubble-active {
    background: var(--active-bubble-bg);
    z-index: 5;
    box-shadow: 
        inset 0 1px 0 rgba(255,255,255,0.15),
        0 4px 12px rgba(0,0,0,0.4);
    position-anchor: --active-target;
}

.bubble-hover {
    background: var(--hover-bubble-bg);
    z-index: 1;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.05);
    position-anchor: --nav-container;
    opacity: 1; 
}

.top-nav:has(li:hover) .bubble-hover {
    position-anchor: --hover-target;
    opacity: 1;
}
</style>

<nav class="top-nav">
    <div class="bubble bubble-hover"></div>
    <div class="bubble bubble-active"></div>
    <ul>
        <li><a href="#" class="nav-link active" id="nav-dashboard">Dashboard</a></li>
        <li><a href="#" class="nav-link" id="nav-sheet">Sheet</a></li>
        <li><a href="#" class="nav-link" id="nav-employees">Employees</a></li>
        <li><a href="#" class="nav-link" id="nav-dc">Create DC</a></li>
        <li><a href="#" class="nav-link" id="nav-projects">Projects</a></li>
        <li><a href="#" class="nav-link" id="nav-scanner">Network Scanner</a></li>
        <li><a href="#" class="nav-link" id="nav-ocr">Document OCR</a></li>
        <li><a href="#" class="nav-link" id="nav-warranty">Warranty</a></li>
        <li><a href="#" class="nav-link" id="nav-settings">Settings</a></li>
        <li><a href="#" class="nav-link" id="nav-releases">Releases</a></li>
    </ul>
</nav>
