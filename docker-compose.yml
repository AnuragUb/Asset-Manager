version: '3.8'

services:
  # Production Environment
  app-prod:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: asset-manager-prod
    restart: always
    ports:
      - "8080:8080"
    volumes:
      # Map host data directory to container data directory
      # Ensure you create these folders on your host machine: ./data/prod
      - ./data/prod:/app/data
      # Optionally mount uploads if they are stored in backend folder
      - ./data/prod/uploads:/app/web-app/asset-manager-backend/uploads
    environment:
      - PORT=8080
      - NODE_ENV=production
      - DATA_DIR=/app/data
      - DB_PATH=/app/data/database_v2.db

  # Testing Environment
  app-test:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: asset-manager-test
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      # Map host data directory to container data directory
      # Ensure you create these folders on your host machine: ./data/test
      - ./data/test:/app/data
      - ./data/test/uploads:/app/web-app/asset-manager-backend/uploads
    environment:
      - PORT=9090
      - NODE_ENV=development
      - DATA_DIR=/app/data
      - DB_PATH=/app/data/database_v2.db
